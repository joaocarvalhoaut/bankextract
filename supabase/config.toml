
# ── dispatch-scheduler ────────────────────────────────────────────────────────
# Chamado pelo pg_cron a cada minuto via net.http_post.
# verify_jwt = false porque a autenticação é feita via x-cron-secret.
[functions.dispatch-scheduler]
enabled = true
verify_jwt = false
entrypoint = "./functions/dispatch-scheduler/index.ts"

[functions.process-import-ocr]
enabled = true
verify_jwt = true
import_map = "./functions/process-import-ocr/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/process-import-ocr/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/process-import-ocr/*.html" ]
